{% extends "base.html" %}
{% block main %}
<h1>Create an account</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('register') }}">
    <label>Name <input name="name" value="{{ form.get('name', '') }}" required></label>
    <label>Email <input name="email" value="{{ form.get('email', '') }}" required></label>
    <label>Phone <input name="phone" value="{{ form.get('phone', '') }}" required></label>
    <label>Password <input type="password" name="password" required></label>
    <button>Register</button>
</form>
<p><a href="{{ url_for('login') }}">Back to sign in</a></p>
{% endblock %}
